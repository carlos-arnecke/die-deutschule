<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>German Level Test v1.1 — for teachers</title>
<link rel="stylesheet" href="../styles.css">
<style>
  /* Renders the two review documents, one per tab. Same tokens as the
   * test; only the bits a Markdown document and a tab strip need on top. */
  .doc { max-width: 720px; margin: 0 auto; padding: 32px 20px 96px; }
  .doc .back { display: inline-block; margin-bottom: 20px; font-size: .9rem; color: var(--accent); }

  .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--line); margin: 0 0 28px; }
  .tab {
    font: inherit; font-size: .95rem; padding: 10px 16px; cursor: pointer;
    background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px;
    color: var(--muted); border-radius: 0;
  }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
  .tab:focus-visible { outline: 3px solid #ffbf47; outline-offset: -3px; }
  .pane[hidden] { display: none; }

  .pane h1 { font-size: 1.6rem; line-height: 1.25; margin: 0 0 16px; }
  .pane h2 { font-size: 1.3rem; margin: 40px 0 10px; padding-top: 14px; border-top: 1px solid var(--line); }
  .pane h3 { font-size: 1.05rem; margin: 26px 0 8px; }
  .pane p, .pane li { max-width: 68ch; }
  .pane hr { border: 0; border-top: 1px solid var(--line); margin: 28px 0; }
  .pane table { border-collapse: collapse; width: 100%; font-size: .92rem; margin: 10px 0 16px; }
  .pane th, .pane td { text-align: left; vertical-align: top; padding: 7px 10px; border-bottom: 1px solid var(--line); }
  .pane th { font-weight: 600; background: var(--soft); }
  .pane blockquote { margin: 10px 0 14px; padding: 10px 14px; border-left: 3px solid var(--line); background: var(--soft); }
  .pane blockquote p { margin: 0; }
  .pane a { color: var(--accent); }
</style>
</head>
<body>

<main class="doc">
  <a class="back" href="../">← Back to the test</a>

  <div class="tabs" role="tablist" aria-label="Documents">
    <button class="tab" role="tab" id="tab-review" aria-controls="pane-review" aria-selected="true" data-tab="review">For teachers</button>
    <button class="tab" role="tab" id="tab-theory" aria-controls="pane-theory" aria-selected="false" data-tab="theory">Theory &amp; framework</button>
  </div>

  <section class="pane" role="tabpanel" id="pane-review" aria-labelledby="tab-review" data-src="../for-teachers-review.md"><p class="muted">Loading…</p></section>
  <section class="pane" role="tabpanel" id="pane-theory" aria-labelledby="tab-theory" data-src="../01-theory-and-framework.md" hidden><p class="muted">Loading…</p></section>
</main>

<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script>
(function () {
  var tabs = [].slice.call(document.querySelectorAll('.tab'));
  var panes = [].slice.call(document.querySelectorAll('.pane'));

  /* Each pane loads its Markdown once, the first time it is shown. */
  function load(pane) {
    if (pane.dataset.loaded) return;
    pane.dataset.loaded = '1';
    var src = pane.dataset.src;
    fetch(src, { cache: 'no-cache' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (md) { pane.innerHTML = marked.parse(md); })
      .catch(function () {
        pane.innerHTML = '<p>Could not load the document. <a href="' + src + '">Open the plain file</a>.</p>';
      });
  }

  /* The URL hash names the tab (#review / #theory) so a link can open either one. */
  function show(name, push) {
    var known = tabs.some(function (t) { return t.dataset.tab === name; });
    if (!known) name = tabs[0].dataset.tab;
    tabs.forEach(function (t) { t.setAttribute('aria-selected', t.dataset.tab === name ? 'true' : 'false'); });
    panes.forEach(function (p) {
      var on = p.id === 'pane-' + name;
      p.hidden = !on;
      if (on) load(p);
    });
    if (push && location.hash !== '#' + name) history.replaceState(null, '', '#' + name);
    window.scrollTo(0, 0);
  }

  tabs.forEach(function (t) { t.addEventListener('click', function () { show(t.dataset.tab, true); }); });
  window.addEventListener('hashchange', function () { show(location.hash.slice(1), false); });
  show(location.hash.slice(1), false);
})();
</script>
</body>
</html>
