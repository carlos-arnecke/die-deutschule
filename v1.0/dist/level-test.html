<title>German Level Test</title>

<style>

:root {

  --surface: #fff;

  --ink: #1a1a1a;

  --accent: #1b56a4;

  --bad: #a3261a;
  --warn-bg: #fff8e1;
  --warn-line: #e8d48b;
}

/* Minimal dark override so nobody on a dark system gets a glaring page. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #1a1c1e;
    --surface: #212427;
    --soft: #2a2d31;
    --ink: #e8e6e3;
    --muted: #9b9792;
    --line: #383c41;
    --accent: #7fb3f0;
    --ok: #6cc186;
    --bad: #ec8c82;
    --warn-bg: #2e2718;
    --warn-line: #4d4229;
  }
}
:root[data-theme="dark"] {
  --ground: #1a1c1e;
  --surface: #212427;
  --soft: #2a2d31;
  --ink: #e8e6e3;
  --muted: #9b9792;
  --line: #383c41;
  --accent: #7fb3f0;
  --ok: #6cc186;
  --bad: #ec8c82;
  --warn-bg: #2e2718;
  --warn-line: #4d4229;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

#app { max-width: 720px; margin: 0 auto; padding: 32px 20px 96px; }

h2 { font-size: 1.6rem; line-height: 1.25; margin: 0 0 6px; }
h3 { font-size: 1.05rem; margin: 28px 0 8px; }
.sub { color: var(--muted); margin: 0 0 22px; }
.body { margin-bottom: 26px; }
.footer { border-top: 1px solid var(--line); padding-top: 18px; }

.progress {
  color: var(--muted); font-size: .82rem;
  text-transform: uppercase; letter-spacing: .06em;
  margin-bottom: 14px;
}

button { font: inherit; padding: 11px 20px; border-radius: 4px; cursor: pointer; border: 1px solid var(--accent); }
button.primary { background: var(--accent); color: var(--ground); }
button.ghost { background: none; color: var(--accent); }
button:focus-visible { outline: 3px solid #ffbf47; outline-offset: 2px; }

/* The only chrome: a restart button parked out of the way. */
.floating-restart {
  position: fixed; right: 18px; bottom: 18px; z-index: 30;
  font-size: .85rem; padding: 8px 14px;
  background: var(--surface); color: var(--accent);
  border: 1px solid var(--line);
  box-shadow: 0 1px 4px rgba(0, 0, 0, .12);
}
.floating-restart:hover { border-color: var(--accent); }

.opt {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 11px 14px; margin-bottom: 8px;
  background: var(--surface);
  border: 1px solid var(--line); border-radius: 4px; cursor: pointer;
}
.opt:hover { background: var(--soft); }
.opt input { margin-top: 4px; flex: none; accent-color: var(--accent); }
.opt span { display: block; min-width: 0; }
.opt strong { font-weight: 500; }
.opt em { display: block; font-style: normal; color: var(--muted); font-size: .88rem; margin-top: 2px; }

fieldset { border: 0; padding: 0; margin: 0 0 26px; }
legend { font-weight: 600; padding: 0; margin-bottom: 10px; }
.hintlabel { font-weight: 400; color: var(--muted); font-size: .85rem; }

.stem { font-size: 1.2rem; margin: 0 0 18px; }
.passage {
  margin: 0 0 18px; padding: 14px 16px;
  background: var(--soft); border-left: 3px solid var(--line);
  font-size: .97rem;
}

.dots { display: flex; gap: 6px; margin: 0 0 20px; }
.dot { width: 26px; height: 5px; border-radius: 3px; background: var(--line); }
.dot.done { background: var(--muted); }
.dot.here { background: var(--accent); }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 24px; }
.fld { display: block; }
.fld span { display: block; font-size: .88rem; color: var(--muted); margin-bottom: 4px; }
.fld input {
  width: 100%; padding: 9px 11px; font: inherit;
  color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 4px;
}

.warn { color: var(--bad); margin: 0 0 12px; }

/* Disclaimers — visible, but not shouting. */
.notice {
  background: var(--soft);
  border: 1px solid var(--line);
  border-left: 3px solid var(--muted);
  padding: 12px 15px; margin: 0 0 20px;
  font-size: .92rem;
}
.notice p { margin: 0; }
.notice p + p { margin-top: 8px; }
.staffbar { background: var(--warn-bg); border: 1px solid var(--warn-line); padding: 10px 14px; border-radius: 4px; }
.modelink { font-size: .85rem; color: var(--muted); margin: 18px 0 0; }

.result-level { border: 1px solid var(--line); border-radius: 6px; padding: 20px; margin-bottom: 20px; }
.result-level .big { font-size: 3rem; font-weight: 700; line-height: 1; color: var(--accent); }
.result-level .levelname { font-weight: 600; margin: 4px 0 10px; }
.result-level p { margin: 0 0 6px; }

.lead { font-size: 1.1rem; font-weight: 600; margin: 0 0 8px; }
.path { margin: 10px 0 18px; }
.rung { display: inline-block; padding: 3px 9px; border: 1px solid var(--line); border-radius: 3px; font-size: .9rem; }
.rung.now { background: var(--accent); color: var(--ground); border-color: var(--accent); }
.rung.goal { border-color: var(--accent); border-width: 2px; font-weight: 700; }

.card { border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px; margin-bottom: 10px; }
.card p { margin: 6px 0 0; }
.card em { font-style: normal; color: var(--muted); }
.card.flag { background: var(--warn-bg); border-color: var(--warn-line); }
.card.step.start { border-left: 4px solid var(--line); }
.card.step.goal { border-left: 4px solid var(--accent); }
.steptag { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 4px; }

ul.plain { padding-left: 20px; margin: 0 0 14px; }
ul.plain li { margin-bottom: 6px; }
.muted { color: var(--muted); font-size: .9rem; }
.small { font-size: .87rem; }
.disclaimer { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 28px; }

details { margin: 0 0 22px; }
summary { cursor: pointer; color: var(--accent); }
.devbox > summary { color: var(--muted); }

.qreview { padding-left: 22px; }
.qreview li { margin-bottom: 14px; }
.qreview .mark { font-weight: 700; }
.qreview li.ok .mark { color: var(--ok); }
.qreview li.no .mark { color: var(--bad); }
.qreview .q { margin: 3px 0; }
code, .qreview code { background: var(--soft); padding: 1px 5px; border-radius: 3px; font-size: .85rem; }

textarea {
  width: 100%; display: block;
  font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color: var(--ink); background: var(--soft);

}

section { margin-bottom: 8px; }
a { color: var(--accent); }

@media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
</style>

<script>
/* ===== data/items.js ===== */
/* die deutSCHule — level test item bank (v3)
 *
 * 10 items per CEFR level, A1-C1. Six are sampled per set at runtime.
 * Every item has FOUR options and exactly ONE defensible answer — see
 * data/README-items.md before editing, and keep both of those properties.
 *
 * answer = index into options, BEFORE shuffling. The app shuffles at render.
 *
 * v3: went from three options to four. A fourth option only helps if it is
 * genuinely plausible — a filler fourth looks like four and works like three.
 * Several distractors that were nearly right are noted inline.
 */

var ITEM_BANK = {

  /* ---------------------------------------------------------------- A1 --
   * Present tense, sein/haben, articles, W-questions, basic word order,
   * accusative, everyday vocabulary.
   */
  A1: [
    { id: 'A1-01', skill: 'grammar', tag: 'sein-conjugation',
      prompt: 'Hallo! Wie ___ dein Name?',
      options: ['ist', 'bin', 'bist', 'sind'], answer: 0,
      note: 'Was a "heißen" item, but heißen has only three distinct present forms — no room for a fourth option.' },

    { id: 'A1-02', skill: 'grammar', tag: 'article-gender',
      prompt: 'Das ist ___ Tasche.',
      options: ['eine', 'ein', 'einen', 'einem'], answer: 0 },

    { id: 'A1-03', skill: 'grammar', tag: 'verb-conjugation',
      prompt: 'Ich ___ aus Brasilien.',
      options: ['komme', 'kommst', 'kommt', 'kommen'], answer: 0 },

    { id: 'A1-04', skill: 'grammar', tag: 'w-question',
      prompt: '___ wohnst du? — In Berlin.',
      options: ['Wo', 'Was', 'Wer', 'Wann'], answer: 0 },

    { id: 'A1-05', skill: 'grammar', tag: 'haben-conjugation',
      prompt: 'Wir ___ am Montag keine Zeit.',
      options: ['haben', 'hat', 'habt', 'hast'], answer: 0 },

    { id: 'A1-06', skill: 'grammar', tag: 'accusative',
      prompt: 'Ich trinke ___ Kaffee.',
      options: ['einen', 'ein', 'eine', 'einem'], answer: 0 },

    { id: 'A1-07', skill: 'grammar', tag: 'word-order-v2',

      options: ['schlafe ich', 'ich schlafe', 'ich schlafen', 'schlafen ich'], answer: 0 },

    { id: 'A1-08', skill: 'vocab', tag: 'everyday',
      prompt: 'Entschuldigung, wie viel ___ das Ticket?',
      options: ['kostet', 'kauft', 'bezahlt', 'zahlt'], answer: 0 },

    { id: 'A1-09', skill: 'grammar', tag: 'sein-haben',
      prompt: 'Ich kann heute nicht kommen. Ich ___ krank.',
      options: ['bin', 'habe', 'ist', 'sind'], answer: 0 },

    { id: 'A1-10', skill: 'grammar', tag: 'preposition-place',
      prompt: 'Meine Familie wohnt ___ Spanien.',
      options: ['in', 'an', 'auf', 'bei'], answer: 0 }
  ],

  /* ---------------------------------------------------------------- A2 --
   * Perfekt, modal verbs, dative, separable verbs, comparatives,
   * weil/wenn subordinate clauses, fixed prepositions.
   */
  A2: [
    { id: 'A2-01', skill: 'grammar', tag: 'perfekt-auxiliary',
      prompt: 'Gestern ___ ich einen guten Film gesehen.',
      options: ['habe', 'bin', 'war', 'werde'], answer: 0,

    { id: 'A2-02', skill: 'grammar', tag: 'dative-preposition',
      prompt: 'Ich fahre jeden Tag ___ Bus zur Arbeit.',

    { id: 'A2-03', skill: 'grammar', tag: 'dative-object',

      options: ['meinem', 'meinen', 'mein', 'meines'], answer: 0 },

    { id: 'A2-04', skill: 'grammar', tag: 'subordinate-clause',

      options: ['weil', 'denn', 'aber', 'und'], answer: 0,

    { id: 'A2-05', skill: 'grammar', tag: 'comparative',
      prompt: 'Berlin ist ___ als Hamburg.',
      options: ['größer', 'groß', 'am größten', 'die größte'], answer: 0 },

    { id: 'A2-06', skill: 'grammar', tag: 'separable-verb',

      options: ['fährt', 'abfährt', 'fahrt', 'fahren'], answer: 0 },

    { id: 'A2-07', skill: 'grammar', tag: 'perfekt-participle',
      prompt: 'Wann bist du nach Deutschland ___?',
      options: ['gekommen', 'gekommt', 'kommen', 'kam'], answer: 0 },

    { id: 'A2-08', skill: 'vocab', tag: 'fixed-preposition',
      prompt: 'Ich interessiere mich sehr ___ Musik.',
      options: ['für', 'an', 'auf', 'über'], answer: 0 },

    { id: 'A2-09', skill: 'grammar', tag: 'wenn-clause',
      prompt: 'Wenn das Wetter schön ist, ___ wir im Park spazieren.',
      options: ['gehen', 'wir gehen', 'gehe', 'geht'], answer: 0 },

    { id: 'A2-10', skill: 'grammar', tag: 'modal-verb',
      prompt: 'Heute Abend muss ich leider noch ___.',
      options: ['arbeiten', 'arbeite', 'gearbeitet', 'zu arbeiten'], answer: 0 }
  ],

  /* ---------------------------------------------------------------- B1 --

  B1: [
    { id: 'B1-01', skill: 'grammar', tag: 'konjunktiv-2',

    { id: 'B1-02', skill: 'grammar', tag: 'relative-clause',

    { id: 'B1-03', skill: 'grammar', tag: 'passive',
      prompt: 'Das Formular ___ von der Behörde geprüft.',
      options: ['wird', 'ist', 'hat', 'werden'], answer: 0,
      note: 'Teachers: please check "ist". With a von-agent the Vorgangspassiv is what is wanted, but flag it if you find "ist" defensible.' },

    { id: 'B1-04', skill: 'grammar', tag: 'adjective-ending',
      prompt: 'Ich habe endlich einen ___ Job gefunden.',
      options: ['interessanten', 'interessante', 'interessanter', 'interessantes'], answer: 0 },

    { id: 'B1-05', skill: 'grammar', tag: 'word-order-inversion',

    { id: 'B1-06', skill: 'vocab', tag: 'fixed-preposition',
      prompt: 'Ich freue mich schon ___ das lange Wochenende.',

    { id: 'B1-07', skill: 'grammar', tag: 'genitive-preposition',
      prompt: 'Trotz ___ Regens sind wir spazieren gegangen.',
      options: ['des', 'dem', 'der', 'den'], answer: 0 },

    { id: 'B1-08', skill: 'grammar', tag: 'purpose-clause',
      prompt: 'Ich lerne Deutsch, ___ ich hier studieren kann.',
      options: ['damit', 'um', 'obwohl', 'indem'], answer: 0 },

    { id: 'B1-09', skill: 'vocab', tag: 'admin-german',
      prompt: 'Bitte ___ Sie das Formular vollständig ___.',

    { id: 'B1-10', skill: 'reading', tag: 'gist',
      passage: 'Liebe Nachbarinnen und Nachbarn,\n\nam Samstag renovieren wir das Treppenhaus. Von 9 bis 16 Uhr ist der Aufzug außer Betrieb. Wer Möbel transportieren möchte, sollte das bitte vorher oder an einem anderen Tag tun.\n\nVielen Dank für Ihr Verständnis!',
      prompt: 'Was sollen die Nachbarn am Samstag beachten?',
      options: [
        'Der Aufzug kann tagsüber nicht benutzt werden.',
        'Das Treppenhaus ist den ganzen Tag gesperrt.',
        'Möbeltransporte sind am Samstag günstiger.',
        'Der Aufzug wird am Samstag repariert.'
      ], answer: 0 }
  ],

  /* ---------------------------------------------------------------- B2 --
   * Concessive connectors, modal passive, je/desto, relative pronouns in
   * the genitive, als ob, participial attributes, precise collocation.
   */
  B2: [
    { id: 'B2-01', skill: 'grammar', tag: 'concessive-preposition',
      prompt: '___ der schlechten Vorbereitung hat das Team gewonnen.',
      options: ['Trotz', 'Wegen', 'Aufgrund', 'Infolge'], answer: 0 },

    { id: 'B2-02', skill: 'grammar', tag: 'modal-passive',
      prompt: 'Die Arbeit muss bis Freitag ___.',
      options: ['erledigt werden', 'erledigen werden', 'geworden erledigt', 'werden erledigt'], answer: 0,
      note: '"erledigt sein" was rejected as a fourth option — it is correct German (Zustandspassiv).' },

    { id: 'B2-03', skill: 'grammar', tag: 'je-desto',
      prompt: 'Je mehr ich übe, ___ sicherer fühle ich mich.',
      options: ['desto', 'dann', 'so', 'als'], answer: 0,
      note: '"umso" is equally correct, so it is deliberately not offered.' },

    { id: 'B2-04', skill: 'grammar', tag: 'relative-genitive',
      prompt: 'Das Gesetz, ___ Auswirkungen umstritten sind, tritt bald in Kraft.',
      options: ['dessen', 'deren', 'dem', 'welches'], answer: 0 },

    { id: 'B2-05', skill: 'grammar', tag: 'irrealis-comparison',
      prompt: 'Er tut so, ___ er alles besser wüsste.',
      options: ['als ob', 'wenn', 'obwohl', 'damit'], answer: 0 },

    { id: 'B2-06', skill: 'grammar', tag: 'participial-attribute',
      prompt: 'Die gestern ___ Studie sorgt für heftige Diskussionen.',
      options: ['veröffentlichte', 'veröffentlichende', 'veröffentlicht', 'veröffentlichten'], answer: 0 },

    { id: 'B2-07', skill: 'vocab', tag: 'connector',
      prompt: 'Der Kurs war teuer. ___ hat er sich gelohnt.',

    { id: 'B2-08', skill: 'vocab', tag: 'verb-precision',
      prompt: 'Es ist damit zu rechnen, dass die Mieten weiter ___.',

    { id: 'B2-09', skill: 'vocab', tag: 'collocation',
      prompt: 'Der Betrieb legt großen Wert ___ Pünktlichkeit.',

    { id: 'B2-10', skill: 'reading', tag: 'inference',
      passage: 'Dass Homeoffice die Produktivität steigert, gilt inzwischen als gut belegt. Weniger eindeutig ist jedoch, wie sich die dauerhafte Abwesenheit vom Büro auf den Zusammenhalt in Teams auswirkt. Erste Langzeitstudien deuten darauf hin, dass der informelle Austausch – und damit womöglich auch die Innovationskraft – darunter leidet.',
      prompt: 'Was lässt sich dem Text entnehmen?',
      options: [
        'Die Wirkung auf den Teamzusammenhalt ist noch nicht abschließend geklärt.',

        'Langzeitstudien belegen, dass die Innovationskraft zunimmt.',
        'Der informelle Austausch im Büro gilt inzwischen als überschätzt.'

/* The level order lives in recommend.js as LEVELS — single source of truth. */

<script>
/* ===== data/recommend.js ===== */
/* die deutSCHule — course data + recommendation engine (v2)
 *
 * All prices, fees, course content and rules come from the Brain folder:
 *   02-courses-and-services.md, 02b-course-levels-detail.md, 03-pricing.md,
 *   05-exams.md, 08-student-resources.md
 * Update them HERE and nowhere else.
 *
 * Deliberately NOT in this file: course start dates and exam dates.
 * Per 04-schedules.md those go stale; we link to the schedules page instead.
 *
 * v2 change: whole CEFR levels only (A1-C1). No sub-levels are shown anywhere.
 * We still keep an internal `position` ("start" / "middle") because the front
 * desk finds it useful, but it never appears on the public result.
 */

var SCHOOL = {
  name: 'die deutSCHule',

var LEVEL_WEEKS = { A1: 8, A2: 8, B1: 8, B2: 12, C1: 12 };

/* What each level actually gives you. Written from 02b-course-levels-detail.md.

  },
  B1: {

  },

  },
  C1: {

    learn: 'Catch implied and nuanced meaning, move between registers, handle demanding texts, and write ' +
           'accurate, varied German. Writing is the main emphasis, alongside longer spoken presentations.',
    useFor: 'University admission and demanding professional work. telc C1 Hochschule can exempt you from ' +
            'proving your German to a university — confirm it with your institution.',
    book: 'Kontext C1'
  }
};

/* Intensive course packages — 03-pricing.md */
var PACKAGES = [
  { weeks: 1,  standard: 103,  visa: null },
  { weeks: 2,  standard: 187,  visa: null },
  { weeks: 3,  standard: 268,  visa: null },
  { weeks: 4,  standard: 318,  visa: null },
  { weeks: 8,  standard: 636,  visa: null },
  { weeks: 12, standard: 954,  visa: 1062 },
  { weeks: 16, standard: 1272, visa: null },
  { weeks: 24, standard: 1839, visa: 2039 },
  { weeks: 36, standard: 2758, visa: 3058 },
  { weeks: 48, standard: 3677, visa: 4077 }
];

var FEES = {
  registrationStandard: 0,
  registrationVisa: 30,
  certificateOfAttendance: 10,
  courseChange: 10
};

var ADDONS = {
  blueMonday4:  { name: 'Blue Monday (4 Mondays)', price: 36, lessons: 2 },
  blueMonday2m: { name: 'Blue Monday (2 months)',  price: 70, lessons: 2 },
  formatD:      { name: 'Format D — conversation course', price: 298, weeks: 4 }
};

var EXAM_PREP = {
  telcB1:   { name: 'telc B1 preparation',          price: 377, weeks: 4 },
  telcB2C1: { name: 'telc B2 / C1 Hochschule prep', price: 389, weeks: 4 },
  testdaf:  { name: 'TestDaF preparation',          price: 398, weeks: 5 }
};

var EXAM_FEES = {
  zertifikatDeutsch: { internal: 118, external: 149 },
  telcB1:  { internal: 185, external: 195 },
  telcB2:  { internal: 185, external: 195 },
  telcC1H: { internal: 195, external: 205 },
  testdaf: { digital: 210, paper: 215 }
};

/* 08-student-resources.md — typically visa-exempt for a language stay.
 * Indicative only; the copy always tells people to verify with their embassy. */
var VISA_EXEMPT = [
  'Austria','Belgium','Bulgaria','Croatia','Cyprus','Czechia','Denmark','Estonia',
  'Finland','France','Germany','Greece','Hungary','Ireland','Italy','Latvia',
  'Lithuania','Luxembourg','Malta','Netherlands','Poland','Portugal','Romania',
  'Slovakia','Slovenia','Spain','Sweden','Iceland','Liechtenstein','Norway',
  'Switzerland','Australia','Israel','Japan','South Korea','Canada','New Zealand',
  'United States'
];

/* ------------------------------------------------------------------ *
 * Placement: block results -> a level
 * ------------------------------------------------------------------ */

/** blocks: [{ level:'A1', correct:5, total:6 }, ...] in the order administered.
 *  Returns the level the person should JOIN, not the one they have finished. */
function placeFromBlocks(blocks) {
  var MASTERY = 5;   // out of 6
  var PARTIAL = 3;

  var byLevel = {};
  blocks.forEach(function (b) { byLevel[b.level] = b; });

  var mastered = [];
  var stopLevel = null;
  var stopScore = 0;

  for (var i = 0; i < LEVELS.length; i++) {
    var b = byLevel[LEVELS[i]];
    // Never administered: the ladder only skips blocks it had good reason to.
    if (!b) continue;
    if (b.correct >= MASTERY) { mastered.push(LEVELS[i]); continue; }
    stopLevel = LEVELS[i];
    stopScore = b.correct;
    break;
  }

  if (!stopLevel) {
    return {
      level: 'C1', index: LEVELS.indexOf('C1'), position: 'complete',
      mastered: mastered, atCeiling: true,
      note: 'You answered everything up to C1 correctly. This test cannot measure above C1.'
    };
  }

  return {
    level: stopLevel,
    index: LEVELS.indexOf(stopLevel),
    position: stopScore >= PARTIAL ? 'middle' : 'start',  // internal only
    mastered: mastered,
    atCeiling: false,
    note: null
  };
}

/* ------------------------------------------------------------------ *
 * Recommendation
 * ------------------------------------------------------------------ */

function targetIndexFor(state) {
  if (state.targetLevel && state.targetLevel !== 'unsure') {
    var i = LEVELS.indexOf(state.targetLevel);
    if (i > -1) return i;
  }
  var goals = state.goals || [];
  if (goals.indexOf('university') > -1)  return LEVELS.indexOf('C1');
  if (goals.indexOf('work') > -1)        return LEVELS.indexOf('B2');
  if (goals.indexOf('visa') > -1)        return LEVELS.indexOf('B1');
  if (goals.indexOf('citizenship') > -1) return LEVELS.indexOf('B1');
  return LEVELS.indexOf('B1');
}

function snapToPackage(weeks, visa) {
  var pool = PACKAGES.filter(function (p) { return !visa || p.visa !== null || p.weeks <= 8; });
  var pick = pool[0];
  for (var i = 0; i < pool.length; i++) {
    pick = pool[i];
    if (pool[i].weeks >= weeks) break;
  }
  return pick;
}

function priceOf(pkg, visa) {
  if (visa && pkg.visa) return { price: pkg.visa, contract: 'visa' };
  return { price: pkg.standard, contract: 'standard' };
}

/** Format D needs B1.2 per the Brain. Without sub-levels we approximate:
 *  above B1, or placed in B1 having already answered half the B1 items right. */
function qualifiesForFormatD(p) {
  return p.index > LEVELS.indexOf('B1') ||
         (p.index === LEVELS.indexOf('B1') && p.position === 'middle');
}

/** state = the whole answer object from app.js. Returns plain data;
 *  app.js decides how to render it. */
function recommend(state) {
  var p = state.placement;
  var idx = p.index;
  var isVisa = state.visa === 'applying';
  var online = state.format === 'online';
  var exams = state.exams || [];

  var r = {
    level: p.level,
    levelInfo: LEVEL_INFO[p.level],
    journey: null,
    course: null,
    price: null,
    addons: [],
    exams: [],
    flags: [],
    nextSteps: []
  };

  /* --- 1. the course to join now ------------------------------------ */
  if (!p.atCeiling) {
    r.course = {
      level: p.level,
      name: 'Intensive course ' + p.level + (online ? ' — online' : ' — in person, Berlin-Neukölln'),
      lessonsPerWeek: 16,
      days: 'Tuesday–Friday',
      slot: state.timeSlot || null,
      weeks: LEVEL_WEEKS[p.level],
      price: (PACKAGES.filter(function (x) { return x.weeks === LEVEL_WEEKS[p.level]; })[0] || {}).standard,
      maxClassSize: SCHOOL.maxClassSize
    };
  } else {
    r.flags.push({
      type: 'ceiling',
      text: 'You are already at C1. Rather than starting a new level, look at Format D, the telc C1 ' +
            'Hochschule exam or TestDaF — or talk to us about joining a C1 group to keep it sharp.'
    });
  }

  /* --- 2. the journey to their goal --------------------------------- */
  var target = targetIndexFor(state);

  if (p.atCeiling || target < idx) {
    r.journey = null;
    if (!p.atCeiling && target < idx) {
      r.flags.push({
        type: 'already-there',
        text: 'You aimed for ' + LEVELS[target] + ' and you are already past it — you tested into ' +
              p.level + '. Aim higher, or use ' + p.level + ' to sit the exam you need.'
      });
    }
  } else {
    var path = LEVELS.slice(idx, target + 1);
    var weeks = path.reduce(function (n, L) { return n + LEVEL_WEEKS[L]; }, 0);
    var pkg = snapToPackage(weeks, isVisa);
    var pr = priceOf(pkg, isVisa);

    r.journey = {
      from: p.level,
      to: LEVELS[target],
      steps: path.map(function (L, i) {
        return {
          level: L,
          weeks: LEVEL_WEEKS[L],
          isStart: i === 0,
          isGoal: i === path.length - 1,
          info: LEVEL_INFO[L]
        };
      }),
      totalWeeks: weeks
    };
    r.price = {
      packageWeeks: pkg.weeks,
      price: pr.price,
      contract: pr.contract,
      registrationFee: isVisa ? FEES.registrationVisa : FEES.registrationStandard,
      coversWholeJourney: pkg.weeks >= weeks
    };

    if (isVisa && pr.contract !== 'visa') {
      r.flags.push({
        type: 'visa-contract',
        text: 'Visa contracts start at 12 weeks. The package above is shorter, so it would be a standard ' +
              'contract — tell us what your visa requires and we will put the right one together.'
      });
    }
  }

  /* --- 3. how long they said they have ------------------------------ */
  if (state.weeksAvailable && r.journey && Number(state.weeksAvailable) < r.journey.totalWeeks) {
    var have = Number(state.weeksAvailable);
    var used = 0, reached = null;
    for (var i = 0; i < r.journey.steps.length; i++) {
      if (used + r.journey.steps[i].weeks > have) break;
      used += r.journey.steps[i].weeks;
      reached = r.journey.steps[i].level;
    }
    r.flags.push({
      type: 'timeline',
      text: reached
        ? 'You said you have about ' + have + ' weeks. That is enough to finish ' + reached +
          ', not ' + r.journey.to + ' — reaching ' + r.journey.to + ' takes about ' +
          r.journey.totalWeeks + ' weeks of intensive study. Either plan for longer, or treat ' +
          reached + ' as this year’s goal and continue later.'
        : 'You said you have about ' + have + ' weeks, and a full level takes ' +
          LEVEL_WEEKS[p.level] + '. You can absolutely start — shorter blocks are sold from one week — ' +
          'but you would not complete ' + p.level + ' in that time. Worth a conversation.'
    });
  }

  /* --- 4. visa ------------------------------------------------------ */
  if (isVisa) {
    r.addons.push({
      key: 'blueMonday',
      name: ADDONS.blueMonday4.name,
      price: ADDONS.blueMonday4.price,
      why: 'Intensive courses are 16 lessons a week. Many language visas require 18. ' +
           'Blue Monday adds 2 lessons and closes the gap.'
    });
    r.flags.push({
      type: 'visa',
      text: 'Language visa: apply early — the process can take up to 4 months. You register and pay for ' +
            'the course first, then we post you an official registration confirmation to submit with your ' +
            'application. Registration for a visa contract costs €' + FEES.registrationVisa + '. ' +
            'If the visa is refused you are refunded, minus the registration fee and a 19% admin fee.'
    });
  } else if (state.visa === 'unsure') {
    var likelyExempt = VISA_EXEMPT.indexOf(state.nationality) > -1;
    r.flags.push({
      type: 'visa',
      text: likelyExempt
        ? 'Based on your nationality you most likely do not need a visa for a language stay — but confirm ' +
          'with the German Federal Foreign Office or your embassy.'
        : 'You may need a language visa. Check with your German embassy, and tell us early if you do — ' +
          'the paperwork takes time and a visa contract works differently.'
    });
  }

  /* --- 5. speaking gap and conversation ----------------------------- */
  if (state.selfAssessGap) {
    var speakingWhy = 'Your grammar and reading are ahead of how confident you feel speaking. ' +
      'Blue Monday is 90 minutes of speaking practice a week and you can join any Monday.';
    var bm = r.addons.filter(function (a) { return a.key === 'blueMonday'; })[0];
    if (bm) {
      bm.why += ' It fits you for a second reason too: ' + speakingWhy.charAt(0).toLowerCase() + speakingWhy.slice(1);
    } else {
      r.addons.push({ key: 'blueMonday', name: ADDONS.blueMonday4.name, price: ADDONS.blueMonday4.price, why: speakingWhy });
    }
    r.flags.push({
      type: 'speaking-gap',
      text: 'Worth knowing: this test only measures reading and grammar, and you told us speaking is the ' +
            'hard part. That is common and it does not change your level — but come to a free trial lesson ' +
            'so we can hear you before you commit.'
    });
  }

  if ((state.goals || []).indexOf('conversation') > -1 && qualifiesForFormatD(p)) {
    r.addons.push({
      key: 'formatD',
      name: ADDONS.formatD.name,
      price: ADDONS.formatD.price,
      why: 'Four weeks of conversation built around real excursions in Berlin. Designed for B2 and C1, ' +
           'open from the second half of B1 — you qualify.' +
           (state.timeSlot === 'afternoon'
             ? ' One catch: it runs Tue–Thu 13:15–16:30, the same slot as the afternoon intensive course, ' +
               'so one of the two would need a different time.'
             : ' It runs Tue–Thu 13:15–16:30.')
    });
  }

  /* --- 6. exams (multi-select) -------------------------------------- */
  var wants = exams.filter(function (e) { return e !== 'none'; });
  var iB1 = LEVELS.indexOf('B1'), iB2 = LEVELS.indexOf('B2');

  function addExam(e) { r.exams.push(e); }

  if (wants.indexOf('telc') > -1) {
    if (idx >= iB2) {
      addExam({ name: 'telc B2 or C1 Hochschule', prep: EXAM_PREP.telcB2C1, fee: EXAM_FEES.telcB2,
        feeLabel: 'with a prep course / without',
        note: 'Booking the prep course takes €10 off the exam fee. Results come from telc GmbH in 4–6 weeks. ' +
              'If you fail one part you retake only that part.' });
    } else if (idx >= iB1) {
      addExam({ name: 'telc B1', prep: EXAM_PREP.telcB1, fee: EXAM_FEES.telcB1,
        feeLabel: 'with a prep course / without',
        note: 'Booking the prep course takes €10 off the exam fee. Results take 4–6 weeks. ' +
              'If you fail one part you retake only that part.' });
    } else {
      var weeksToB1 = LEVELS.slice(idx, iB1).reduce(function (n, L) { return n + LEVEL_WEEKS[L]; }, 0);
      addExam({ name: 'telc B1', prep: null, fee: EXAM_FEES.telcB1,
        feeLabel: 'with a prep course / without',
        note: 'You need to reach B1 first — about ' + weeksToB1 + ' weeks of intensive course from where ' +
              'you are now. The prep course opens up once you get there.' });
    }
  }

  if (wants.indexOf('testdaf') > -1) {
    addExam({ name: 'TestDaF', prep: idx >= iB2 ? EXAM_PREP.testdaf : null, fee: EXAM_FEES.testdaf,
      feeLabel: 'digital / paper-based',
      note: 'You need TDN 4 in all four sections, and sections cannot be retaken on their own — failing one ' +
            'means resitting the whole exam. B2 is the minimum, C1 is what we recommend. telc C1 Hochschule ' +
            'is the alternative and does allow partial retakes.' });
  }

  if (wants.indexOf('zertifikat') > -1) {
    addExam({ name: 'Zertifikat Deutsch (our in-house exam)', prep: null, fee: EXAM_FEES.zertifikatDeutsch,
      feeLabel: 'if you study with us / if you do not',
      note: 'A1 to C1, set and marked here, so results come back in about a week instead of 4–6. Individual ' +
            'dates are possible. There is no prep course for it — sample exams for A1–B1 are on our website. ' +
            'It is recognised wherever a specific other exam is not explicitly required.' });
  }

  if (wants.indexOf('unsure') > -1 && !r.exams.length) {
    addExam({ name: 'Which exam? Let us help you choose', prep: null, fee: null,
      note: 'telc is the usual choice for visa, residence and citizenship. TestDaF or telc C1 Hochschule are ' +
            'for university. Our own Zertifikat Deutsch is fastest if you just need proof of progress. ' +
            'Tell us what the certificate is for and we will point you at the right one.' });
  }

  /* --- 7. trial lesson, age, next steps ----------------------------- */
  if (p.level === 'A1' && !p.atCeiling) {
    r.nextSteps.push('The free trial lesson runs from A2 upwards, so it is not available at A1 — but come to ' +
      'the office anyway and see the school before you decide.');
  } else {
    r.nextSteps.push('Book a free trial lesson. Come to the office at least 30 minutes before the class starts.');
  }

  if (state.ageBand === 'under16') {
    r.flags.push({ type: 'age', text: 'Our courses are for adults. Please contact the office directly — we can talk through the options.' });
  } else if (state.ageBand === '16-17') {
    r.flags.push({ type: 'age', text: 'From 16 you can join, but we speak with you first. Give the office a call.' });
  }

  r.nextSteps.push('Check current start dates on the schedules page — they change every few weeks.');
  r.nextSteps.push('Register online, by email, or in person at Karl-Marx-Straße 107.');

  r.disclaimer = 'One more time, because it matters: this is a rough guideline, not an official test. ' +
    'It estimated your level from a handful of grammar, vocabulary and reading questions — it did not test ' +
    'your speaking, writing or listening, it is not an exam, and it is not proof of anything to an employer, ' +
    'a university or an authority. The prices and timings above are what we normally charge and how long ' +
    'courses normally take; we will confirm everything with you properly. And a course on its own does not ' +
    'produce a certificate — only passing an exam does.';

  return r;
}
</script>
<script>
/* ===== app.js ===== */
/* die deutSCHule — level test + lead capture (v2)
 * Flow, state and the adaptive ladder. No dependencies, no build step.
 * See 00-spec.md for why the flow is ordered the way it is.
 */

(function () {
  'use strict';

  var MODE = new URLSearchParams(location.search).get('mode') === 'staff' ? 'staff' : 'public';
  var BLOCK_SIZE = 6;

  function freshState() { return {
    mode: MODE,
    startedAt: new Date().toISOString(),
    prior: null,
    blocks: [],          // completed blocks
    currentBlock: null,
    direction: null,     // 'up' | 'down' | null
    placement: null,
    self: { speaking: null, writing: null, listening: null },
    selfAssessGap: false,
    goals: [],
    targetLevel: null,
    exams: [],
    visa: null,
    format: null,
    timeSlot: null,
    weeksAvailable: null,
    startWhen: null,
    firstName: '', lastName: '', email: '', phone: '',
    ageBand: '', countryResidence: '', nationality: '', contactLanguage: 'en',
    contactConsent: false, marketingConsent: false,
    contactSkipped: false
  }; }

  var S = freshState();
  var app = document.getElementById('app');

  /* Wipes everything and returns to the intro. Optionally switches mode —
   * the two versions ask for contact details at different points, so a mode
   * change has to start over. */
  function restart(mode) {
    if (mode) MODE = mode;
    S = freshState();
    intro();
  }

  var protoRestart = document.getElementById('proto-restart');
  if (protoRestart) protoRestart.addEventListener('click', function () { restart(); });

  /* ---------------------------------------------------------------- utils */

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function sample(arr, n) { return shuffle(arr.slice()).slice(0, n); }
  function nl2br(s) { return esc(s).replace(/\n/g, '<br>'); }
  function eur(n) { return '€' + Number(n).toLocaleString('de-DE'); }

  function screen(title, sub, bodyHtml, footerHtml) {
    app.innerHTML =
      '<div class="screen">' +
        '<h2>' + title + '</h2>' +
        (sub ? '<p class="sub">' + sub + '</p>' : '') +
        '<div class="body">' + bodyHtml + '</div>' +
        '<div class="footer">' + (footerHtml || '') + '</div>' +
      '</div>';
    window.scrollTo(0, 0);
  }

  function progress(step, total, label) {
    return '<div class="progress">Step ' + step + ' of ' + total + (label ? ' — ' + label : '') + '</div>';
  }

  function radios(name, items, current) {
    return items.map(function (o) {
      var id = name + '_' + o.value;
      return '<label class="opt" for="' + id + '">' +
        '<input type="radio" name="' + name + '" id="' + id + '" value="' + esc(o.value) + '"' +
        (current === o.value ? ' checked' : '') + '>' +
        '<span><strong>' + esc(o.label) + '</strong>' +
        (o.hint ? '<em>' + esc(o.hint) + '</em>' : '') + '</span></label>';
    }).join('');
  }

  function checks(name, items, current) {
    return items.map(function (o) {
      var id = name + '_' + o.value;
      return '<label class="opt" for="' + id + '">' +
        '<input type="checkbox" name="' + name + '" id="' + id + '" value="' + esc(o.value) + '"' +
        (current.indexOf(o.value) > -1 ? ' checked' : '') + '>' +
        '<span><strong>' + esc(o.label) + '</strong>' +
        (o.hint ? '<em>' + esc(o.hint) + '</em>' : '') + '</span></label>';
    }).join('');
  }

  function picked(name) { var n = document.querySelector('input[name="' + name + '"]:checked'); return n ? n.value : null; }
  function pickedAll(name) { return [].slice.call(document.querySelectorAll('input[name="' + name + '"]:checked')).map(function (n) { return n.value; }); }
  function val(id) { var n = document.getElementById(id); return n ? n.value.trim() : ''; }
  function on(sel, fn) { var n = document.querySelector(sel); if (n) n.addEventListener('click', fn); }

  function warn(msg) {
    var f = document.querySelector('.footer');
    var old = document.querySelector('.warn');
    if (old) old.remove();
    f.insertAdjacentHTML('afterbegin', '<p class="warn">' + esc(msg) + '</p>');
  }

  function findItem(id) {
    var lvl = id.slice(0, 2);
    return (ITEM_BANK[lvl] || []).filter(function (i) { return i.id === id; })[0];
  }

  /* ------------------------------------------------------------- 1. intro */

  function intro() {
    screen('How good is your German?',
      'A short test that gives you a rough idea of your level and which course to start in.',
      '<div class="notice">' +
        '<p><strong>This is a rough guide, not an official test.</strong> It is not an exam, it is not a formal ' +
        'placement, and it gives you nothing you can show an employer or an authority. Think of it as a ' +
        'starting point for the conversation.</p>' +
        '<p>It looks at grammar, vocabulary and reading only — it cannot hear you speak. We always confirm ' +
        'your real level with you before you start a course.</p>' +
      '</div>' +
      '<ul class="plain">' +
        '<li><strong>About 8 minutes.</strong> The test adapts — it stops as soon as it has a good idea of where you are.</li>' +
        '<li><strong>You get a level and a plan:</strong> which course to join, how long it takes to reach your goal, what it costs.</li>' +
        '<li><strong>Nothing to prepare.</strong> Answer honestly — guessing well only lands you in a class that is too hard.</li>' +
      '</ul>' +
      (MODE === 'staff' ? '<p class="staffbar">Front-desk version — contact details are optional, and you get a summary to copy at the end.</p>' : ''),
      '<button class="primary" id="go">Start the test</button>');
    on('#go', prior);

    document.querySelector('.body').insertAdjacentHTML('beforeend',
      '<p class="modelink"><a href="#" id="modeswap">' +
      (MODE === 'staff' ? 'Switch to the website version' : 'Open the front-desk version') +
      '</a> — for the team, not for visitors.</p>');
    on('#modeswap', function (e) {
      e.preventDefault();
      restart(MODE === 'staff' ? 'public' : 'staff');
    });
  }

  /* -------------------------------------------------------- 2. prior German */

  var PRIOR = [
    { value: 'none', label: 'None at all — I am starting from zero', hint: 'We will skip the test' },
    { value: 'A1',   label: 'A few words, or I have just started' },
    { value: 'A2',   label: 'I can handle simple everyday situations' },
    { value: 'B1',   label: 'I can hold a conversation on familiar topics' },
    { value: 'B2',   label: 'I am comfortable with complex and abstract topics' }
  ];

  function prior() {
    screen('How much German do you already know?',
      'Be honest — this only decides where the test starts. It corrects itself either way.',
      progress(1, 6, 'about you') + radios('prior', PRIOR, S.prior),
      '<button class="primary" id="next">Continue</button>');
    on('#next', function () {
      var v = picked('prior');
      if (!v) return warn('Pick one to continue.');
      S.prior = v;
      if (v === 'none') {
        S.placement = { level: 'A1', index: 0, position: 'start', mastered: [], atCeiling: false,
          note: 'No prior German, so you start at the beginning — A1. No test needed.' };
        return goals();
      }
      startBlock(v);
      testScreen();
    });
  }

  /* ----------------------------------------------------------- 3. the test */

  function prepItem(it) {
    var opts = it.options.map(function (text, i) { return { text: text, correct: i === it.answer }; });
    shuffle(opts);
    return { id: it.id, skill: it.skill, tag: it.tag, passage: it.passage || null, prompt: it.prompt, options: opts };
  }

  function startBlock(level) {
    S.currentBlock = {
      level: level,
      items: sample(ITEM_BANK[level], BLOCK_SIZE).map(prepItem),
      idx: 0, correct: 0, answers: []
    };
  }

  function testScreen() {
    var b = S.currentBlock;
    var it = b.items[b.idx];
    var setNo = S.blocks.length + 1;
    var prev = b.answers[b.idx];

    var dots = b.items.map(function (_, i) {
      var cls = i === b.idx ? 'here' : (b.answers[i] ? 'done' : '');
      return '<span class="dot ' + cls + '"></span>';
    }).join('');

    screen('Question ' + (b.idx + 1) + ' of ' + b.items.length,
      'Choose the option that fits.',
      '<div class="progress">Set ' + setNo + '</div>' +
      '<div class="dots">' + dots + '</div>' +
      (it.passage ? '<blockquote class="passage">' + nl2br(it.passage) + '</blockquote>' : '') +
      '<p class="stem">' + esc(it.prompt) + '</p>' +
      it.options.map(function (o, i) {
        return '<label class="opt" for="o' + i + '"><input type="radio" name="ans" id="o' + i + '" value="' + i + '"' +
               (prev && prev.chosen === i ? ' checked' : '') + '>' +
               '<span><strong>' + esc(o.text) + '</strong></span></label>';
      }).join('') +
      '<p class="muted">Most people finish after two or three sets — the test stops as soon as it knows your level. ' +
      'A set is always ' + BLOCK_SIZE + ' questions.</p>',

      (b.idx > 0 ? '<button class="ghost" id="back">Back</button> ' : '') +
      '<button class="primary" id="next">' + (prev ? 'Save and continue' : 'Next') + '</button> ' +
      '<button class="ghost" id="dunno">I don\'t know</button>');

    on('#next', function () {
      var v = picked('ans');
      if (v === null) return warn('Pick an answer, or use "I don\'t know".');
      answer(Number(v));
    });
    on('#dunno', function () { answer(-1); });
    on('#back', function () { b.idx--; testScreen(); });
  }

  /** optIdx = index into the shuffled options, or -1 for "I don't know". */
  function answer(optIdx) {
    var b = S.currentBlock;
    var it = b.items[b.idx];
    var chosen = optIdx >= 0 ? it.options[optIdx] : null;

    b.answers[b.idx] = {
      id: it.id, level: b.level, skill: it.skill, tag: it.tag,
      chosen: optIdx,
      given: chosen ? chosen.text : '(skipped)',
      correctAnswer: it.options.filter(function (o) { return o.correct; })[0].text,
      correct: !!(chosen && chosen.correct)
    };
    b.correct = b.answers.filter(function (a) { return a && a.correct; }).length;

    b.idx++;
    if (b.idx < b.items.length) return testScreen();
    finishBlock();
  }

  function finishBlock() {
    var b = S.currentBlock;
    S.blocks.push({ level: b.level, correct: b.correct, total: b.items.length, answers: b.answers });

    var i = LEVELS.indexOf(b.level);
    var done = S.blocks.map(function (x) { return x.level; });

    // Mastered — climb, unless we are already on the way down or at the top.
    if (b.correct >= 5) {
      if (S.direction !== 'down' && i < LEVELS.length - 1 && done.indexOf(LEVELS[i + 1]) < 0) {
        S.direction = 'up';
        startBlock(LEVELS[i + 1]);
        return testScreen();
      }
      return endTest();
    }
    // Failed badly — drop down, unless we climbed here or we are at the bottom.
    if (b.correct <= 2) {
      if (S.direction !== 'up' && i > 0 && done.indexOf(LEVELS[i - 1]) < 0) {
        S.direction = 'down';
        startBlock(LEVELS[i - 1]);
        return testScreen();
      }
      return endTest();
    }
    return endTest();   // partial — this is the level they are working at
  }

  function endTest() {
    S.currentBlock = null;
    S.placement = placeFromBlocks(S.blocks);
    selfCheck();
  }

  /* ------------------------------------------------------- 4. self-check */

  var CANDO = [
    { key: 'speaking',  q: 'I can speak German in everyday situations without preparing first.' },
    { key: 'writing',   q: 'I can write emails or messages in German without help.' },
    { key: 'listening', q: 'I can follow German speakers when they talk at normal speed.' }
  ];
  var SCALE = [
    { value: '0', label: 'Not at all' },
    { value: '1', label: 'With difficulty' },
    { value: '2', label: 'Fairly well' },
    { value: '3', label: 'Easily' }
  ];

  function selfCheck() {
    screen('Three quick questions about yourself',
      'The test measured reading and grammar. This tells us about the rest.',
      progress(3, 6, 'self-check') +
      CANDO.map(function (c) {
        return '<fieldset><legend>' + esc(c.q) + '</legend>' + radios('self_' + c.key, SCALE, null) + '</fieldset>';
      }).join(''),
      '<button class="primary" id="next">Continue</button>');

    on('#next', function () {
      for (var i = 0; i < CANDO.length; i++) {
        var v = picked('self_' + CANDO[i].key);
        if (v === null) return warn('Please answer all three.');
        S.self[CANDO[i].key] = Number(v);
      }
      var idx = S.placement.index;
      S.selfAssessGap = (idx >= LEVELS.indexOf('B1') && S.self.speaking <= 1) ||
                        (idx >= LEVELS.indexOf('C1') && S.self.speaking <= 2);
      goals();
    });
  }

  /* ------------------------------------------------------------ 5. goals */

  var GOALS = [
    { value: 'visa',         label: 'A visa or residence permit' },
    { value: 'university',   label: 'Studying at a German university' },
    { value: 'work',         label: 'Work or my career' },
    { value: 'everyday',     label: 'Everyday life in Germany' },
    { value: 'citizenship',  label: 'Citizenship' },
    { value: 'conversation', label: 'Speaking more confidently' },
    { value: 'interest',     label: 'Personal interest' }
  ];
  var TARGETS = [
    { value: 'unsure', label: 'I am not sure — recommend something' },
    { value: 'A2', label: 'A2 — basic everyday German' },
    { value: 'B1', label: 'B1 — independent everyday use', hint: 'Commonly asked for in residence and citizenship procedures' },
    { value: 'B2', label: 'B2 — confident at work' },
    { value: 'C1', label: 'C1 — university and professional level' }
  ];
  var EXAMS = [
    { value: 'telc',       label: 'telc', hint: 'Widely accepted for visa, residence and citizenship' },
    { value: 'testdaf',    label: 'TestDaF', hint: 'For university admission' },
    { value: 'zertifikat', label: 'Zertifikat Deutsch — our in-house exam', hint: 'A1–C1, results in about a week' },
    { value: 'unsure',     label: 'I need a certificate but do not know which' },
    { value: 'none',       label: 'No certificate — I just want to learn' }
  ];

  function goals() {
    screen('What do you need German for?',
      'Pick everything that applies.',
      progress(4, 6, 'your goal') +
      '<fieldset><legend>Why are you learning German?</legend>' + checks('goals', GOALS, S.goals) + '</fieldset>' +
      '<fieldset><legend>Which level do you want to reach?</legend>' + radios('target', TARGETS, S.targetLevel) + '</fieldset>' +
      '<fieldset><legend>Do you need an official certificate? <span class="hintlabel">Pick as many as apply</span></legend>' +
        checks('exams', EXAMS, S.exams) + '</fieldset>',
      '<button class="primary" id="next">Continue</button>');

    on('#next', function () {
      S.goals = pickedAll('goals');
      S.targetLevel = picked('target');
      S.exams = pickedAll('exams');
      if (!S.goals.length) return warn('Pick at least one reason.');
      if (!S.targetLevel) return warn('Tell us which level you are aiming for.');
      if (!S.exams.length) return warn('Let us know about certificates — pick "No certificate" if none apply.');
      if (S.exams.length > 1 && S.exams.indexOf('none') > -1) {
        S.exams = S.exams.filter(function (e) { return e !== 'none'; });
      }
      situation();
    });
  }

  /* -------------------------------------------------------- 6. situation */

  var VISA = [
    { value: 'applying', label: 'Yes — I need a language visa', hint: 'Changes the contract, the price and the lessons per week' },
    { value: 'have',     label: 'No — I already live in Germany' },
    { value: 'exempt',   label: 'No — I do not need a visa (EU or visa-free nationality)' },
    { value: 'unsure',   label: 'I am not sure' }
  ];
  var FORMAT = [
    { value: 'inperson', label: 'In person in Berlin-Neukölln' },
    { value: 'online',   label: 'Live online', hint: 'Same teachers, same course, same price' },
    { value: 'unsure',   label: 'Either works' }
  ];
  var SLOTS = [
    { value: 'morning',   label: 'Morning — 09:15 to 12:30' },
    { value: 'afternoon', label: 'Afternoon — 13:15 to 16:30', hint: 'In person only' },
    { value: 'evening',   label: 'Evening — 17:00 to 20:15' },
    { value: 'flexible',  label: 'Flexible' }
  ];
  var WEEKS = [
    { value: '4',  label: 'About a month' },
    { value: '8',  label: 'About two months' },
    { value: '12', label: 'About three months' },
    { value: '24', label: 'About six months' },
    { value: '48', label: 'A year or more' },
    { value: '',   label: 'Not sure yet' }
  ];
  var START = [
    { value: 'asap',    label: 'As soon as possible' },
    { value: '1month',  label: 'Within a month' },
    { value: '3months', label: 'In two or three months' },
    { value: 'later',   label: 'Later than that' },
    { value: 'unsure',  label: 'Not sure' }
  ];

  function situation() {
    screen('How would you like to study?', '',
      progress(5, 6, 'your situation') +
      '<fieldset><legend>Do you need a visa to study here?</legend>' + radios('visa', VISA, S.visa) + '</fieldset>' +
      '<fieldset><legend>In person or online?</legend>' + radios('format', FORMAT, S.format) + '</fieldset>' +
      '<fieldset><legend>Which time of day suits you?</legend>' + radios('slot', SLOTS, S.timeSlot) + '</fieldset>' +
      '<fieldset><legend>How long can you study for?</legend>' + radios('weeks', WEEKS, S.weeksAvailable) + '</fieldset>' +
      '<fieldset><legend>When do you want to start?</legend>' + radios('start', START, S.startWhen) + '</fieldset>',
      '<button class="ghost" id="back">Back</button> <button class="primary" id="next">Continue</button>');

    on('#next', function () {
      S.visa = picked('visa'); S.format = picked('format'); S.timeSlot = picked('slot');
      S.weeksAvailable = picked('weeks'); S.startWhen = picked('start');
      if (!S.visa || !S.format || !S.timeSlot || S.weeksAvailable === null || !S.startWhen) {
        return warn('Please answer all five.');
      }
      contact();
    });
    on('#back', goals);
  }

  /* ---------------------------------------------------------- 7. contact */

  var AGES = ['under16', '16-17', '18-24', '25-34', '35-49', '50+'];

  function contact() {
    var countries = VISA_EXEMPT.concat(['Brazil', 'Colombia', 'Mexico', 'Argentina', 'Chile', 'Peru',
      'Turkey', 'Ukraine', 'Russia', 'India', 'Pakistan', 'Bangladesh', 'China', 'Vietnam', 'Indonesia',
      'Philippines', 'Thailand', 'Iran', 'Iraq', 'Syria', 'Lebanon', 'Egypt', 'Morocco', 'Tunisia',
      'Algeria', 'Nigeria', 'Ghana', 'Kenya', 'South Africa', 'Ethiopia', 'United Kingdom', 'Serbia',
      'Bosnia and Herzegovina', 'Albania', 'Kosovo', 'North Macedonia', 'Georgia', 'Armenia', 'Kazakhstan']).sort();

    screen(MODE === 'staff' ? 'Visitor details' : 'Where should we send your plan?',
      MODE === 'staff'
        ? 'Fill in what the visitor is happy to give. You can skip this entirely.'
        : 'Your level is ready. We will show it either way — these details let us put a real course, a timeline and a price next to it.',
      progress(6, 6, 'your details') +
      '<div class="grid">' +
        field('firstName', 'First name', 'text', true) +
        field('lastName', 'Last name', 'text', false) +
        field('email', 'Email', 'email', true) +
        field('phone', 'Phone (optional)', 'tel', false) +
      '</div>' +
      '<fieldset><legend>Age</legend>' +
        radios('age', AGES.map(function (a) { return { value: a, label: a.replace('under16', 'Under 16').replace('50+', '50 or over') }; }), S.ageBand) +
      '</fieldset>' +
      '<div class="grid">' +
        '<label class="fld"><span>Country you live in</span><input id="countryResidence" list="countries" value="' + esc(S.countryResidence) + '"></label>' +
        '<label class="fld"><span>Nationality</span><input id="nationality" list="countries" value="' + esc(S.nationality) + '"></label>' +
      '</div>' +
      '<datalist id="countries">' + countries.map(function (c) { return '<option value="' + esc(c) + '">'; }).join('') + '</datalist>' +
      '<fieldset><legend>Which language should we reply in?</legend>' +
        radios('lang', [{ value: 'en', label: 'English' }, { value: 'de', label: 'Deutsch' }], S.contactLanguage) +
      '</fieldset>' +
      '<label class="opt"><input type="checkbox" id="consent"><span><strong>Yes, contact me about my result and the courses that fit.</strong>' +
        '<em>Required so we can reply. See our <a href="' + SCHOOL.privacyUrl + '" target="_blank" rel="noopener">privacy policy</a>.</em></span></label>' +
      '<label class="opt"><input type="checkbox" id="marketing"><span><strong>Send me course news and start dates too.</strong>' +
        '<em>Optional. You can unsubscribe any time.</em></span></label>',
      '<button class="ghost" id="back">Back</button> ' +
      '<button class="primary" id="next">See my result</button>' +
      (MODE === 'staff' ? ' <button class="ghost" id="skip">Skip — walk-in</button>' : ''));

    on('#next', function () {
      readContact();
      if (MODE !== 'staff') {
        if (!S.firstName) return warn('We need a first name.');
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(S.email)) return warn('That email address does not look right.');
        if (!S.ageBand) return warn('Please pick an age range — some courses have a minimum age.');
        if (!S.contactConsent) return warn('We need your permission to reply before we can send anything.');
      }
      result();
    });
    on('#skip', function () { readContact(); S.contactSkipped = true; result(); });
    on('#back', function () { readContact(); situation(); });
  }

  function readContact() {
    S.firstName = val('firstName'); S.lastName = val('lastName');
    S.email = val('email'); S.phone = val('phone');
    S.ageBand = picked('age') || ''; S.contactLanguage = picked('lang') || 'en';
    S.countryResidence = val('countryResidence'); S.nationality = val('nationality');
    var c = document.getElementById('consent'), m = document.getElementById('marketing');
    S.contactConsent = !!(c && c.checked); S.marketingConsent = !!(m && m.checked);
  }

  function field(id, label, type, required) {
    return '<label class="fld"><span>' + esc(label) + (required ? ' *' : '') + '</span>' +
      '<input id="' + id + '" type="' + type + '" value="' + esc(S[id] || '') + '"></label>';
  }

  /* ----------------------------------------------------------- 8. result */

  function result() {
    var r = recommend(S);
    var p = S.placement;
    var html = '';

    /* --- the level --- */
    html += '<div class="result-level">' +
      '<div class="big">' + esc(p.level) + '</div>' +
      '<p class="levelname">' + esc(r.levelInfo.title) + '</p>' +
      '<p>' + (p.atCeiling
        ? 'You are at C1 — the top of what this test can measure.'
        : 'This is the level you should join, not the level you have finished.') + '</p>' +
      (p.note ? '<p class="muted">' + esc(p.note) + '</p>' : '') +
      '</div>';

    html += '<div class="notice"><p><strong>An estimate, not an official placement.</strong> ' +
      'This was a short online test of grammar, vocabulary and reading — no speaking, no writing, no ' +
      'listening. It is a rough guideline to start your journey, not a qualification, and it is not the ' +
      'same as an exam result. Your teacher confirms your level on day one, and we move you if it is wrong.</p></div>';

    html += howWeGotThere();

    /* --- the journey to their goal — the heart of the page --- */
    if (r.journey) {
      var j = r.journey;
      html += '<section class="journey"><h3>Getting to ' + esc(j.to) + '</h3>' +
        '<p class="lead">' + j.steps.length + (j.steps.length === 1 ? ' level' : ' levels') +
        ' · about ' + j.totalWeeks + ' weeks of intensive study</p>' +
        '<p class="path">' + j.steps.map(function (s) {
          return '<span class="rung' + (s.isStart ? ' now' : '') + (s.isGoal ? ' goal' : '') + '">' + s.level + '</span>';
        }).join(' → ') + '</p>' +
        j.steps.map(function (s) {
          return '<div class="card step' + (s.isStart ? ' start' : '') + (s.isGoal ? ' goal' : '') + '">' +
            '<div class="steptag">' +
              (s.isStart ? 'You start here' : '') +
              (s.isStart && s.isGoal ? ' · ' : '') +
              (s.isGoal ? 'Your goal' : '') +
              (!s.isStart && !s.isGoal ? 'Then' : '') +
            '</div>' +
            '<strong>' + esc(s.info.title) + '</strong> <span class="muted">· ' + s.weeks + ' weeks · ' + esc(s.info.book) + '</span>' +
            '<p><em>What you learn:</em> ' + esc(s.info.learn) + '</p>' +
            (s.isGoal ? '<p><em>What ' + esc(s.level) + ' is good for:</em> ' + esc(s.info.useFor) + '</p>' : '') +
            '</div>';
        }).join('') +
        '</section>';
    }

    /* --- the course they join now --- */
    if (r.course) {
      html += '<section><h3>Your first course</h3>' +
        '<p class="lead">' + esc(r.course.name) + '</p>' +
        '<ul class="plain">' +
          '<li>' + r.course.lessonsPerWeek + ' lessons a week, ' + r.course.days +
            (r.course.slot && r.course.slot !== 'flexible' ? ', ' + esc(r.course.slot) + ' slot' : '') + '</li>' +
          '<li>' + r.course.weeks + ' weeks — ' + eur(r.course.price) + '</li>' +
          '<li>Maximum ' + r.course.maxClassSize + ' students, in person and online alike</li>' +
          '<li>Taught entirely in German from A1 up</li>' +
        '</ul></section>';
    }

    /* --- what the whole journey costs --- */
    if (r.price) {
      html += '<section><h3>What it costs</h3><ul class="plain">' +
        '<li>Closest package we sell to the full journey: <strong>' + r.price.packageWeeks + ' weeks — ' +
          eur(r.price.price) + '</strong>' + (r.price.contract === 'visa' ? ' (visa contract)' : '') + '</li>' +
        '<li>' + (r.price.registrationFee ? 'Registration: ' + eur(r.price.registrationFee) : 'Registration is free') + '</li>' +
        '<li>You do not have to book it all at once — we sell blocks from one week up, and you can book level by level.</li>' +
        '</ul></section>';
    }

    if (r.addons.length) {
      html += '<section><h3>Worth adding</h3>' + r.addons.map(function (a) {
        return '<div class="card"><strong>' + esc(a.name) + ' — ' + eur(a.price) + '</strong><p>' + esc(a.why) + '</p></div>';
      }).join('') + '</section>';
    }

    if (r.exams.length) {
      html += '<section><h3>' + (r.exams.length > 1 ? 'Your exams' : 'Your exam') + '</h3>' +
        r.exams.map(function (e) {
          var fee = '';
          if (e.fee) {
            var parts = (e.feeLabel || 'internal / external').split(' / ');
            var a = e.fee.internal !== undefined ? e.fee.internal : e.fee.digital;
            var b = e.fee.external !== undefined ? e.fee.external : e.fee.paper;
            fee = '<p>Exam fee: ' + eur(a) + ' ' + esc(parts[0]) + ', ' + eur(b) + ' ' + esc(parts[1]) + '.</p>';
          }
          return '<div class="card"><strong>' + esc(e.name) + '</strong>' + fee +
            (e.prep ? '<p>Preparation: ' + esc(e.prep.name) + ' — ' + e.prep.weeks + ' weeks, ' + eur(e.prep.price) + '.</p>' : '') +
            '<p>' + esc(e.note) + '</p></div>';
        }).join('') +
        '<p class="muted">Finishing a course does not give you a certificate. Only passing an exam does.</p></section>';
    }

    if (r.flags.length) {
      html += '<section><h3>Read this before you book</h3>' +
        r.flags.map(function (f) { return '<div class="card flag"><p>' + esc(f.text) + '</p></div>'; }).join('') +
        '</section>';
    }

    html += '<section><h3>Next steps</h3><ol>' +
      r.nextSteps.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ol>' +
      '<p>' + (S.firstName ? esc(S.firstName) + ', we' : 'We') + ' will be in touch — or reach us first: ' +
      '<a href="' + SCHOOL.schedulesUrl + '" target="_blank" rel="noopener">current start dates</a> · ' +
      '<a href="' + SCHOOL.registrationUrl + '" target="_blank" rel="noopener">register</a> · ' +
      esc(SCHOOL.email) + ' · ' + esc(SCHOOL.phone) + '</p></section>';

    html += '<p class="muted disclaimer">' + esc(r.disclaimer) + '</p>';

    if (MODE === 'staff') {
      html += '<section class="staffbox"><h3>Front desk summary</h3>' +
        '<textarea rows="14" readonly id="staffsum">' + esc(staffSummary(r)) + '</textarea>' +
        '<button class="ghost" id="copysum">Copy summary</button></section>';
    }

    html += '<details class="devbox"><summary>Lead data (internal — this is what would go to Jotform / the CRM)</summary>' +
      '<textarea rows="16" readonly>' + esc(JSON.stringify(buildLead(r), null, 2)) + '</textarea></details>';

    screen('Your German level', '', html, '<button class="ghost" id="restart">Start again</button>');
    on('#restart', function () { restart(); });
    on('#copysum', function (e) {
      var t = document.getElementById('staffsum');
      var done = function () { e.target.textContent = 'Copied'; setTimeout(function () { e.target.textContent = 'Copy summary'; }, 1600); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(t.value).then(done, function () { t.select(); });
      } else { t.select(); try { document.execCommand('copy'); done(); } catch (err) { /* leave it selected */ } }
    });
  }

  /** The two "how did we decide this" dropdowns. The per-question one is
   *  internal — see 00-spec.md §9 before launch. */
  function howWeGotThere() {
    if (!S.blocks.length) return '';
    var html = '<details><summary>How we got there</summary><ul class="plain">' +
      S.blocks.map(function (b) {
        return '<li>' + b.level + ' questions: <strong>' + b.correct + ' of ' + b.total + '</strong> correct' +
          (b.correct >= 5 ? ' — solid, so we moved up' : b.correct <= 2 ? ' — not yet, so we moved down' : ' — about half, so we stopped here') + '</li>';
      }).join('') +
      '</ul><p class="muted">The test starts where you told us and moves up or down until it settles. ' +
      'It stopped after ' + S.blocks.length + ' set' + (S.blocks.length === 1 ? '' : 's') + '.</p></details>';

    var all = S.blocks.reduce(function (a, b) { return a.concat(b.answers); }, []);
    html += '<details class="devbox"><summary>Question by question (internal review)</summary>' +
      '<p class="muted">Internal only — this is here so we can check the item bank. It comes out before launch.</p>' +
      '<ol class="qreview">' + all.map(function (a) {
        var item = findItem(a.id);
        return '<li class="' + (a.correct ? 'ok' : 'no') + '">' +
          '<span class="mark">' + (a.correct ? '✓' : '✗') + '</span> ' +
          '<code>' + esc(a.id) + '</code> <span class="muted">' + esc(a.skill) + ' · ' + esc(a.tag) + '</span>' +
          (item && item.passage ? '<div class="muted small">[reading text]</div>' : '') +
          '<div class="q">' + esc(a.given === '(skipped)' ? (item ? item.prompt : '') : (item ? item.prompt : '')) + '</div>' +
          '<div class="small">Answered: <strong>' + esc(a.given) + '</strong>' +
          (a.correct ? '' : ' · Correct: <strong>' + esc(a.correctAnswer) + '</strong>') + '</div>' +
          '</li>';
      }).join('') + '</ol></details>';
    return html;
  }

  /* -------------------------------------------------------------- output */

  function buildLead(r) {
    return {
      meta: { mode: S.mode, startedAt: S.startedAt, completedAt: new Date().toISOString(), version: 'v2' },
      contact: {
        firstName: S.firstName, lastName: S.lastName, email: S.email, phone: S.phone,
        ageBand: S.ageBand, countryOfResidence: S.countryResidence, nationality: S.nationality,
        contactLanguage: S.contactLanguage, skipped: S.contactSkipped
      },
      consent: { contact: S.contactConsent, marketing: S.marketingConsent },
      test: {
        priorSelfDeclared: S.prior,
        blocks: S.blocks.map(function (b) { return { level: b.level, correct: b.correct, total: b.total }; }),
        itemsAnswered: S.blocks.reduce(function (n, b) { return n + b.total; }, 0),
        answers: S.blocks.reduce(function (a, b) { return a.concat(b.answers); }, []),
        placement: S.placement.level,
        positionInLevel: S.placement.position,   // internal: 'start' | 'middle' | 'complete'
        atCeiling: S.placement.atCeiling
      },
      selfAssessment: { speaking: S.self.speaking, writing: S.self.writing, listening: S.self.listening, gapFlag: S.selfAssessGap },
      needs: {
        goals: S.goals, targetLevel: S.targetLevel, exams: S.exams, visa: S.visa,
        format: S.format, timeSlot: S.timeSlot, weeksAvailable: S.weeksAvailable, startWhen: S.startWhen
      },
      recommendation: {
        firstCourse: r.course ? r.course.name : null,
        journey: r.journey ? { from: r.journey.from, to: r.journey.to, weeks: r.journey.totalWeeks,
                               path: r.journey.steps.map(function (s) { return s.level; }) } : null,
        price: r.price,
        addons: r.addons.map(function (a) { return a.key; }),
        exams: r.exams.map(function (e) { return e.name; }),
        flags: r.flags.map(function (f) { return f.type; })
      }
    };
  }

  function staffSummary(r) {
    var L = [];
    var scores = S.blocks.map(function (b) { return b.level + ' ' + b.correct + '/' + b.total; }).join(', ');
    L.push('LEVEL: ' + S.placement.level + '   (' + (scores || 'no test — declared zero German') + ')');
    if (S.placement.position && !S.placement.atCeiling) {
      L.push('       ' + (S.placement.position === 'middle'
        ? 'already part-way through ' + S.placement.level
        : 'at the beginning of ' + S.placement.level));
    }

    var who = (S.firstName + ' ' + S.lastName).trim();
    if (who || S.email || S.phone) L.push('NAME:  ' + [who, S.email, S.phone].filter(Boolean).join('   '));
    var where = [S.ageBand && 'age ' + S.ageBand, S.countryResidence && 'lives ' + S.countryResidence,
                 S.nationality && 'national ' + S.nationality].filter(Boolean).join('   ');
    if (where) L.push('WHO:   ' + where);
    if (S.contactSkipped) L.push('NAME:  (walk-in, no details taken)');
    L.push('');
    L.push('WANTS: ' + S.goals.join(', ') + '  -> target ' + S.targetLevel + ', exams: ' + S.exams.join('+'));
    L.push('VISA:  ' + S.visa);
    L.push('FIT:   ' + S.format + ', ' + S.timeSlot + ', ' + (S.weeksAvailable || '?') + ' weeks, start ' + S.startWhen);
    if (S.self.speaking !== null) {
      L.push('SELF:  speaking ' + S.self.speaking + '/3, writing ' + S.self.writing + '/3, listening ' + S.self.listening + '/3' +
        (S.selfAssessGap ? '  << SPEAKING GAP' : ''));
    }
    L.push('');
    L.push('START:   ' + (r.course ? r.course.name : 'already at C1 — Format D / exam route'));
    if (r.journey) L.push('JOURNEY: ' + r.journey.steps.map(function (s) { return s.level; }).join(' -> ') +
      ', ' + r.journey.totalWeeks + ' weeks');
    if (r.price) L.push('PRICE:   closest package ' + r.price.packageWeeks + ' wks EUR ' + r.price.price +
      ' (' + r.price.contract + '), registration EUR ' + r.price.registrationFee);
    if (r.addons.length) L.push('ADD-ONS: ' + r.addons.map(function (a) { return a.name; }).join(' | '));
    if (r.exams.length) L.push('EXAMS:   ' + r.exams.map(function (e) { return e.name; }).join(' | '));
    if (r.flags.length) L.push('FLAGS:   ' + r.flags.map(function (f) { return f.type; }).join(', '));
    return L.join('\n');
  }

  intro();
})();
</script>
