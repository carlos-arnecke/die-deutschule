<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>German Level Test — for teachers</title>
<link rel="stylesheet" href="../styles.css">
<style>
  /* Renders ../for-teachers-review.md. Same tokens as the test; only the
   * bits a Markdown document needs on top. */
  .doc { max-width: 720px; margin: 0 auto; padding: 32px 20px 96px; }
  .doc h1 { font-size: 1.6rem; line-height: 1.25; margin: 0 0 16px; }
  .doc h2 { font-size: 1.3rem; margin: 40px 0 10px; padding-top: 14px; border-top: 1px solid var(--line); }
  .doc h3 { font-size: 1.05rem; margin: 26px 0 8px; }
  .doc p, .doc li { max-width: 68ch; }
  .doc hr { border: 0; border-top: 1px solid var(--line); margin: 28px 0; }
  .doc table { border-collapse: collapse; width: 100%; font-size: .92rem; margin: 10px 0 16px; }
  .doc th, .doc td { text-align: left; vertical-align: top; padding: 7px 10px; border-bottom: 1px solid var(--line); }
  .doc th { font-weight: 600; background: var(--soft); }
  .doc blockquote { margin: 10px 0 14px; padding: 10px 14px; border-left: 3px solid var(--line); background: var(--soft); }
  .doc blockquote p { margin: 0; }
  .doc a { color: var(--accent); }
  .doc .back { display: inline-block; margin-bottom: 20px; font-size: .9rem; }
</style>
</head>
<body>

<main class="doc" id="doc"><p class="muted">Loading…</p></main>

<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script>
(function () {
  var el = document.getElementById('doc');
  fetch('../for-teachers-review.md', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (md) {
      el.innerHTML = '<a class="back" href="../">← Back to the test</a>' + marked.parse(md);
    })
    .catch(function () {
      el.innerHTML = '<p>Could not load the document. <a href="../for-teachers-review.md">Open the plain file</a>.</p>';
    });
})();
</script>
</body>
</html>
